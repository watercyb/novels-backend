name: Build and Deploy Backend

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - develop
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Download latest frontend build
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.FRONTEND_REPO_TOKEN}}
          script: |
            const owner = 'watercyb';
            const repo = 'novels-frontend';

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                status: 'success',
                per_page: 100
              }
            );

            const run = runs.find(
              r => r.event === 'push' && r.head_branch === 'main'
            );

            if (!run) {
              core.setFailed('No successful frontend build found.');
              return;
            }

            console.log(`Using frontend run ${run.id}`);

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id
            });

            const artifact = artifacts.data.artifacts.find(
              a => a.name === 'frontend-dist'
            );

            if (!artifact) {
              core.setFailed('frontend-dist artifact not found.');
              return;
            }

            const response = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: artifact.id,
              archive_format: 'zip'
            });

            require('fs').writeFileSync(
              'frontend-dist.zip',
              Buffer.from(response.data)
            );

      - name: Extract frontend
        run: |
          rm -rf frontend-dist
          mkdir frontend-dist
          unzip frontend-dist.zip -d frontend-dist

      - name: Replace static files
        run: |
          mkdir -p src/main/resources/static
          rm -rf src/main/resources/static/*
          cp -r frontend-dist/* src/main/resources/static/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build backend
        run: ./gradlew clean build -x test

      - name: Prepare JAR
        run: cp build/libs/*-SNAPSHOT.jar novel.jar

      - name: Stop Cat Novels
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo systemctl stop cat-novels

      - name: Upload JAR to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "novel.jar"
          target: "/root/web/cat-novels-web"
          overwrite: true

      - name: Restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo systemctl restart cat-novels
            sudo systemctl status cat-novels --no-pager
